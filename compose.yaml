name: edutrack
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run npm run setup:env}
      POSTGRES_DB: ${POSTGRES_DB:?Run npm run setup:env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:env}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=identity
      JWT_SECRET: ${JWT_SECRET:?Run npm run setup:env}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-8080}
      PORT: 3000
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: EduTrack <noreply@edutrack.test>
      COURSE_STORAGE_ROOT: /app/storage/courses
      ALLOW_TEST_ENROLLMENTS: ${ALLOW_TEST_ENROLLMENTS:-false}
      ENROLLMENT_FIXTURES_FILE: ${ENROLLMENT_FIXTURES_FILE:-}
    volumes:
      - course_files:/app/storage
      - ./tmp/enrollments:/app/fixtures:ro
    ports: ["127.0.0.1:${PORT:-3000}:3000"]
    depends_on:
      db: { condition: service_healthy }
      mailpit: { condition: service_started }
    command: ["sh", "-c", "npm run db:migrate -w @edutrack/api && node apps/api/dist/main.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    init: true
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    ports: ["127.0.0.1:${WEB_PORT:-8080}:8080"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    restart: unless-stopped
volumes:
  postgres_data:
  course_files:
