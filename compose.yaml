name: edutrack
# Local simulation of the production topology (Part C): one deployable backend running as TWO replicas behind Nginx
# (HTTPS, TLS >= 1.2), PostgreSQL with a least-privilege application role, audit anchors on a separate volume and the
# SIMULATED Academic Registry as an external service. "Cloud" = this Compose project on the developer machine.
x-api: &api
  build:
    context: .
    dockerfile: infra/api.Dockerfile
  environment: &api-env
    NODE_ENV: production
    # Runtime role WITHOUT ownership nor UPDATE/DELETE on audit (apps/api/scripts/provision-app-role.mjs).
    DATABASE_URL: postgresql://edutrack_app:${APP_DB_PASSWORD:?Run npm run setup:env}@db:5432/${POSTGRES_DB}?schema=identity
    JWT_SECRET: ${JWT_SECRET:?Run npm run setup:env}
    WEB_ORIGIN: https://localhost:${WEB_TLS_PORT:-8443}
    PORT: 3000
    SMTP_HOST: mailpit
    SMTP_PORT: 1025
    SMTP_FROM: EduTrack <noreply@edutrack.test>
    COURSE_STORAGE_ROOT: /app/storage/courses
    SUBMISSION_STORAGE_ROOT: /app/storage/submissions
    # Only Nginx (private Compose network) may set X-Forwarded-For; rate limits then apply per real client.
    TRUST_PROXY: uniquelocal
    # SIMULADO: Registro Académico de demostración (servicio "registry"), consumido por el adaptador REST de enrollments.
    REGISTRY_URL: http://registry:4010
    REGISTRY_API_KEY: ${REGISTRY_API_KEY:?Run npm run setup:env or add REGISTRY_API_KEY to .env}
    # Chain head of the audit log copied outside the database, on its own volume (CAR-12).
    AUDIT_ANCHOR_DIR: /app/anchors
    AUDIT_ANCHOR_INTERVAL_MS: ${AUDIT_ANCHOR_INTERVAL_MS:-300000}
    # Operational alert checks (registry failures, thresholds) and the backoff base of the registry retries.
    ALERT_INTERVAL_MS: ${ALERT_INTERVAL_MS:-15000}
    REGISTRY_RETRY_BASE_MS: ${REGISTRY_RETRY_BASE_MS:-2000}
  volumes:
    - course_files:/app/storage
    - audit_anchors:/app/anchors
  depends_on:
    migrate: { condition: service_completed_successfully }
    mailpit: { condition: service_started }
    registry: { condition: service_started }
  command: ["node", "apps/api/dist/main.js"]
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 10
  init: true
  restart: unless-stopped
services:
  db:
    image: postgres:17-alpine
    # Connection budget: each API replica may open up to ~100 pooled connections (one pool per module adapter).
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run npm run setup:env}
      POSTGRES_DB: ${POSTGRES_DB:?Run npm run setup:env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:env}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  # One-shot: versioned migrations with the OWNER, then (re)provision of the least-privilege runtime role.
  migrate:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=identity
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run npm run setup:env}
    depends_on:
      db: { condition: service_healthy }
    command: ["sh", "-c", "npm run db:migrate -w @edutrack/api && node apps/api/scripts/provision-app-role.mjs"]
    restart: "no"
  api:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-1
  api2:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-2
  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    ports: ["127.0.0.1:${WEB_PORT:-8080}:8080", "127.0.0.1:${WEB_TLS_PORT:-8443}:8443"]
    volumes: ["tls_certs:/etc/nginx/tls"]
    depends_on:
      api: { condition: service_healthy }
      api2: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://127.0.0.1:8443/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  # SIMULADO: Registro Académico institucional de mentira (no forma parte del LMS). Modo caída: PUT /admin/mode.
  registry:
    build:
      context: .
      dockerfile: infra/registry.Dockerfile
    environment:
      REGISTRY_API_KEY: ${REGISTRY_API_KEY:?Run npm run setup:env or add REGISTRY_API_KEY to .env}
      REGISTRY_MODE: ${REGISTRY_MODE:-up}
    ports: ["127.0.0.1:4010:4010"]
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    restart: unless-stopped
volumes:
  postgres_data:
  course_files:
  # Separate from postgres_data: an attacker rewriting the database cannot rewrite these anchors in the same place.
  audit_anchors:
  tls_certs:
