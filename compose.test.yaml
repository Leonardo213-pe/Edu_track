# Isolated, disposable database; never points integration tests at the development volume.
name: edutrack-test
services:
  db-test:
    image: postgres:17-alpine
    # Same connection budget as compose.yaml (two API replicas in the load test).
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_DB: edutrack_test
      POSTGRES_USER: edutrack_test
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Set a random TEST_DB_PASSWORD}
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edutrack_test -d edutrack_test"]
      interval: 2s
      timeout: 3s
      retries: 20
