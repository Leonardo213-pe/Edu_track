# Edge proxy of the local deployment (Part C): HTTPS with TLS >= 1.2 and two API replicas behind one upstream.
# Docker's embedded DNS is re-resolved so a restarted replica (new IP) rejoins without restarting Nginx.
resolver 127.0.0.11 valid=5s ipv6=off;
upstream edutrack_api {
    zone edutrack_api 64k;
    # Passive health check: a replica that refuses connections is skipped for 5 s and the request goes to the other one.
    server api:3000 resolve max_fails=1 fail_timeout=5s;
    server api2:3000 resolve max_fails=1 fail_timeout=5s;
    keepalive 32;
}
# Plain HTTP only redirects to HTTPS.
server {
    listen 8080;
    server_name _;
    location / { return 301 https://$host:8443$request_uri; }
}
server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    # Self-signed certificate generated on first start (infra/tls-selfsigned.sh); replace with an institutional one.
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:edutrack_tls:5m;
    ssl_session_timeout 1h;
    root /usr/share/nginx/html;
    index index.html;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; frame-src 'self' blob:; media-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    client_max_body_size 26m;
    location /api/ {
        # API responses carry Helmet's own CSP; declaring headers here stops the SPA CSP from being duplicated on JSON/files.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        proxy_pass http://edutrack_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Failover: retry on the other replica when one is down (non-idempotent requests only if never sent).
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 2s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Nginx is the edge: overwrite (never append) so clients cannot spoof the address used by the API rate limiter.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { try_files $uri $uri/ /index.html; }
}
