# SOLO PRUEBAS DE CARGA (override): `docker compose -f compose.yaml -f compose.loadtest.yaml up -d --build`.
# Points both API replicas (and the one-shot migration/role provisioning) at the DISPOSABLE edutrack_test database of
# compose.test.yaml (host port 55432), never at development data, and swaps the edge config for one that keeps the
# client X-Forwarded-For so the load generator can simulate many students from one machine (per-IP limits).
x-test-db: &test-host
  extra_hosts: ["host.docker.internal:host-gateway"]
services:
  migrate:
    <<: *test-host
    environment:
      DATABASE_URL: postgresql://edutrack_test:${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD}@host.docker.internal:55432/edutrack_test?schema=identity
    depends_on: !reset {}
  api:
    <<: *test-host
    environment:
      DATABASE_URL: postgresql://edutrack_app:${APP_DB_PASSWORD}@host.docker.internal:55432/edutrack_test?schema=identity
  api2:
    <<: *test-host
    environment:
      DATABASE_URL: postgresql://edutrack_app:${APP_DB_PASSWORD}@host.docker.internal:55432/edutrack_test?schema=identity
  web:
    volumes:
      - tls_certs:/etc/nginx/tls
      - ./infra/nginx.loadtest.conf:/etc/nginx/conf.d/default.conf:ro
