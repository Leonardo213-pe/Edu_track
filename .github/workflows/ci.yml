name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ["1025:1025", "8025:8025"]
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: edutrack_test
          POSTGRES_USER: edutrack_test
          # Only this ephemeral CI service uses local trust, never development/production.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edutrack_test -d edutrack_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://edutrack_test@localhost:5432/edutrack_test?schema=identity
      TEST_DATABASE_URL: postgresql://edutrack_test@localhost:5432/edutrack_test?schema=identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run db:migrate
      - run: npm run test:integration
